# Catppuccin reads these inputs while it initializes. Ordinary config reloads
# intentionally skip plugins; restart tmux after changing this file.
source-file ~/.config/tmux/palettes/gruvbox.conf
source-file ~/.config/tmux/palettes/gruvbox-material-dark-medium.conf

# Let Catppuccin own component geometry while keeping the complete visual
# vocabulary inside the repository's original Gruvbox palette.
set -g @catppuccin_status_background "none"
set -gF @thm_crust '#{@gruvbox_dark0_hard}'
set -gF @thm_mantle '#{@gruvbox_dark0}'
set -gF @thm_bg '#{@gruvbox_dark0_soft}'
set -gF @thm_surface_0 '#{@gruvbox_dark1}'
set -gF @thm_surface_1 '#{@gruvbox_dark2}'
set -gF @thm_surface_2 '#{@gruvbox_dark3}'
set -gF @thm_overlay_0 '#{@gruvbox_dark4}'
set -gF @thm_overlay_1 '#{@gruvbox_gray}'
set -gF @thm_overlay_2 '#{@gruvbox_light4}'
set -gF @thm_subtext_1 '#{@gruvbox_light3}'
set -gF @thm_subtext_0 '#{@gruvbox_light2}'
set -gF @thm_fg '#{@gruvbox_light1}'
set -gF @thm_rosewater '#{@gruvbox_light0_soft}'
set -gF @thm_flamingo '#{@gruvbox_bright_purple}'
set -gF @thm_pink '#{@gruvbox_bright_purple}'
set -gF @thm_mauve '#{@gruvbox_neutral_purple}'
set -gF @thm_red '#{@gruvbox_bright_red}'
set -gF @thm_maroon '#{@gruvbox_neutral_red}'
set -gF @thm_peach '#{@gruvbox_bright_orange}'
set -gF @thm_yellow '#{@gruvbox_bright_yellow}'
set -gF @thm_green '#{@gruvbox_bright_green}'
set -gF @thm_teal '#{@gruvbox_neutral_aqua}'
set -gF @thm_sky '#{@gruvbox_bright_aqua}'
set -gF @thm_sapphire '#{@gruvbox_neutral_blue}'
set -gF @thm_blue '#{@gruvbox_bright_blue}'
set -gF @thm_lavender '#{@gruvbox_bright_purple}'

# Keep context icons stable; animated status icons use native one-cell frames
# without adding status-line processes.
set -g @catppuccin_application_icon ' '
set -gF @catppuccin_status_application_icon_bg '#{@gruvbox_neutral_orange}'
set -gF @catppuccin_status_application_icon_fg '#{@gruvbox_light0}'
set -g @catppuccin_application_text \
  ' #[bold]#{pane_current_command}#[nobold]'
set -g @catppuccin_host_icon '󱘖 '
set -gF @catppuccin_status_host_icon_bg '#{@gruvbox_neutral_aqua}'
set -gF @catppuccin_status_host_icon_fg '#{@gruvbox_light0}'
set -g @catppuccin_host_text \
  ' #[bold]#{user}@#{host_short}#[nobold]'
set -g @catppuccin_uptime_icon \
  '#{?#{m/r:^[024][0-4]$,%S}, ,#{?#{m/r:^[135][0-4]$,%S}, , }}'
set -gF @catppuccin_status_uptime_icon_fg '#{@gruvbox_light0}'
set -g @catppuccin_uptime_text \
  ' #[nobold]#(uptime | sed "s/^[^,]*up *//; s/, *[[:digit:]]* user.*//; s/ day.*, */d /; s/ hr\\(s*\\).*/h/; s/ min\\(s*\\).*/m/; s/ sec\\(s*\\).*/s/; s/\\([0-9]\\{1,2\\}\\):\\([0-9]\\{1,2\\}\\)/\\1h \\2m/; s/ //g; s/\\([dhms]\\)/#[bold]\\1#[nobold]/g")'
# Lift module bodies one subtle step above the status surface. Put spacing
# before each rounded cap so the final module can still finish flush right.
set -gF @status_right_bg '#{@gruvbox_material_dark_medium_bg_statusline2}'
set -gF @catppuccin_status_module_text_bg '#{@status_right_bg}'
set -g @catppuccin_status_left_separator \
  ' '
set -g @catppuccin_status_right_separator ''

# Window layout, information, and navigation hierarchy.
set -g @catppuccin_window_status_style "custom"
# Give every window parallel one-cell cuts without Catppuccin's solid spacer.
set -g window-status-separator ''
set -g @catppuccin_window_left_separator \
  '#[fg=#{@catppuccin_window_number_color},bg=default]#[bg=#{@catppuccin_window_number_color}]'
set -g @catppuccin_window_current_left_separator \
  '#[fg=#{@catppuccin_window_current_number_color},bg=default]#[bg=#{@catppuccin_window_current_number_color}]'
set -g @catppuccin_window_right_separator \
  '#[fg=#{@catppuccin_window_text_color},bg=default]#[none]'
set -g @catppuccin_window_current_right_separator \
  '#[fg=#{@catppuccin_window_current_text_color},bg=default]#[none]'
# Treat each window as one surface; hue and luminance encode navigation state.
set -g @catppuccin_window_text_color \
  '#{?window_last_flag,#{@gruvbox_neutral_green},#{@gruvbox_dark0_soft}}'
set -g @catppuccin_window_number_color \
  '#{?window_last_flag,#{@gruvbox_neutral_green},#{@gruvbox_dark0_soft}}'
set -g @catppuccin_window_current_text_color '#{@gruvbox_bright_yellow}'
set -g @catppuccin_window_current_number_color '#{@gruvbox_bright_yellow}'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_number \
  '#[fg=#{?window_last_flag,#{@gruvbox_dark0},#{@gruvbox_light4}},bold]#I#[nobold]'
set -g @catppuccin_window_text \
  '#[fg=#{?window_last_flag,#{@gruvbox_dark0},#{@gruvbox_light4}},bold]#W#[nobold]'
set -g @catppuccin_window_current_number \
  '#[fg=#{@gruvbox_dark0},bold]#I#[nobold]'
set -g @catppuccin_window_current_text \
  '#[fg=#{@gruvbox_dark0},bold]#W#[nobold]'
# Keep pane and window state visible without changing label width while active.
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_format \
  '##{?window_bell_flag, 󰂞,}##{?window_zoomed_flag, 󰽏,}##{?##{==:##{pane_mode},copy-mode},##{?selection_active, 󰅍, 󰅌},}'
