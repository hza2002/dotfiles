# Prefix bootstrap. Plugins inspect this value during initialization; the
# IME-aware entry binding replaces it after TPM has loaded.
set -g @ime "command -v macism >/dev/null 2>&1 && macism com.apple.keylayout.ABC >/dev/null 2>&1 || true"
set -g prefix C-f
unbind C-b

# Utility.
# Ghostty Cmd+, sends C-f r. Skip TPM because not every plugin reloads idempotently.
bind    r   set -g @skip_plugin_reload 1 \; \
  source-file ~/.config/tmux/tmux.conf \; \
  set -gu @skip_plugin_reload \; \
  run-shell -b 'token=$$; tmux set-option -g @config_reloaded "$token"; \
    sleep "#{e|/|f|3:#{display-time},1000}"; \
    if [ "$(tmux show-option -gqv @config_reloaded)" = "$token" ]; then \
      tmux set-option -gu @config_reloaded; \
    fi'
bind    :   command-prompt
bind    C-c customize-mode -Z

# Sessions.
bind C run-shell 'sesh connect #{q:pane_current_path}'
bind R command-prompt -I "#S" { rename-session "%%" }
bind s choose-tree -Zs
bind -N "last-session (via sesh)" Tab run-shell "sesh last"
bind -N "project/session picker (sesh)" O display-popup -E -w 80% -h 75% \
  -d "#{pane_current_path}" -T "Projects" \
  "~/.config/tmux/scripts/project-picker.sh"
bind -N "pane manager (tmux-fzf)" P run-shell -b \
  'TMUX_FZF_CLIENT=#{q:client_tty} "$TMUX_PLUGIN_MANAGER_PATH"tmux-fzf/scripts/pane.sh'
bind -N "window manager (tmux-fzf)" W run-shell -b \
  'TMUX_FZF_CLIENT=#{q:client_tty} "$TMUX_PLUGIN_MANAGER_PATH"tmux-fzf/scripts/window.sh'

# Windows.
# Session rename lives on R; remove tmux's duplicate default binding.
unbind '$'
bind c   new-window -c "#{session_path}"
bind ,   command-prompt -I "#W" { rename-window "%%" }
bind f   command-prompt { find-window "%%" }
bind .   command-prompt "move-window -t '%%'"
bind w   choose-tree -Zw
bind n   next-window
bind p   previous-window
bind <   swap-window -d -t -1
bind >   swap-window -d -t +1
bind `   last-window

# Select the requested index when it exists; otherwise use the last window.
# Checking actual indices also handles gaps created by move-window.
bind 1 if -F '#{W:#{?#{==:#{window_index},1},1,}}' 'select-window -t ":1"' 'select-window -t ":{end}"'
bind 2 if -F '#{W:#{?#{==:#{window_index},2},1,}}' 'select-window -t ":2"' 'select-window -t ":{end}"'
bind 3 if -F '#{W:#{?#{==:#{window_index},3},1,}}' 'select-window -t ":3"' 'select-window -t ":{end}"'
bind 4 if -F '#{W:#{?#{==:#{window_index},4},1,}}' 'select-window -t ":4"' 'select-window -t ":{end}"'
bind 5 if -F '#{W:#{?#{==:#{window_index},5},1,}}' 'select-window -t ":5"' 'select-window -t ":{end}"'
bind 6 if -F '#{W:#{?#{==:#{window_index},6},1,}}' 'select-window -t ":6"' 'select-window -t ":{end}"'
bind 7 if -F '#{W:#{?#{==:#{window_index},7},1,}}' 'select-window -t ":7"' 'select-window -t ":{end}"'
bind 8 if -F '#{W:#{?#{==:#{window_index},8},1,}}' 'select-window -t ":8"' 'select-window -t ":{end}"'
bind 9 if -F '#{W:#{?#{==:#{window_index},9},1,}}' 'select-window -t ":9"' 'select-window -t ":{end}"'

# Panes.
bind k split-window -vb -c "#{pane_current_path}"
bind j split-window -v  -c "#{pane_current_path}"
bind h split-window -hb -c "#{pane_current_path}"
bind l split-window -h  -c "#{pane_current_path}"

# Select a pane with prefix+q, followed by its displayed number.

bind S choose-tree 'move-pane -v -s "%%"'
bind V choose-tree 'move-pane -h -s "%%"'

bind x if -F '#{>:#{window_panes},1}' \
  { if -F '#{==:#{pane_current_command},#{b:default-shell}}' \
    { kill-pane } \
    { confirm-before -p 'close #{pane_current_command} in pane #P? (y/n)' kill-pane } } \
  { if -F '#{>:#{session_windows},1}' \
    { confirm-before -p 'kill-window #W? (y/n)' kill-window } \
    { confirm-before -p 'kill-session #S? (y/n)' kill-session } }
bind & if -F '#{>:#{session_windows},1}' \
  { confirm-before -p 'kill-window #W? (y/n)' kill-window } \
  { confirm-before -p 'kill-session #S? (y/n)' kill-session }

# Copy mode (vi).
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi y      send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter  send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-c run-shell "#{@ime}" \; send-keys -X cancel

bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi e send-keys -X next-word-end
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi J send-keys -N 5 -X cursor-down
bind -T copy-mode-vi K send-keys -N 5 -X cursor-up

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# Vim integration: seamless pane and window navigation.
set -g @is_vim_regex '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?)(-wrapped)?(diff)?$'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_regex}'"

# Pane navigation (C-hjkl).
bind -n C-h if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind -n C-j if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -n C-k if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind -n C-l if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

bind -T copy-mode-vi C-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}'  '' 'select-pane -R'

# Pane resize (C-arrows).
bind -n C-Left  if-shell "$is_vim" 'send-keys C-Left'  'resize-pane -L 1'
bind -n C-Down  if-shell "$is_vim" 'send-keys C-Down'  'resize-pane -D 1'
bind -n C-Up    if-shell "$is_vim" 'send-keys C-Up'    'resize-pane -U 1'
bind -n C-Right if-shell "$is_vim" 'send-keys C-Right' 'resize-pane -R 1'

bind -T copy-mode-vi C-Left  resize-pane -L 1
bind -T copy-mode-vi C-Down  resize-pane -D 1
bind -T copy-mode-vi C-Up    resize-pane -U 1
bind -T copy-mode-vi C-Right resize-pane -R 1

# Pane focus can change through the mouse or prefixless navigation.
set-hook -g pane-focus-in 'run-shell "#{@ime}"'

# Give Ghostty a destination sample when an application hides its hardware cursor.
set-hook -g 'after-select-pane[10]' {
  if-shell -F '#{&&:#{==:#{client_termname},xterm-ghostty},#{==:#{cursor_flag},0}}' {
    run-shell -b '"$HOME"/.config/tmux/scripts/ghostty-cursor-sample.sh #{q:client_tty} #{q:client_termname} #{q:pane_id} #{q:cursor_flag} #{q:pane_left} #{q:pane_top} #{q:pane_width} #{q:pane_height} #{q:status-position}'
  }
}
