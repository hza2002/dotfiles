# Terminal and server behavior.
set -g  mouse on
set -g  default-terminal "tmux-256color"
# Let invisible panes reach Ghostty for background command notifications.
set -g  allow-passthrough all
set -s  extended-keys on
if-shell -F '#{>=:#{version},3.5}' \
  'set -s extended-keys-format csi-u'
set -s terminal-features[100] "xterm-ghostty*:extkeys:hyperlinks:overline"
set -s terminal-features[101] "tmux*:clipboard"
set -s  escape-time 0
set -sg repeat-time 300
set -s  focus-events on
setw -g aggressive-resize on
# Relay OSC 52 through nested tmux sessions to the attached terminal client.
set -s  set-clipboard on
set -s  copy-command ''
set -g  history-limit 50000
# When the current session disappears, keep the client alive by switching
# to the most recently active remaining session.
set -g  detach-on-destroy off
set -g  visual-activity off
setw -g monitor-activity off
# Keep terminal bells as silent, persistent window-local alerts.
setw -g monitor-bell on
set -g  bell-action none
set -g  visual-bell off

# Display and indexing.
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
setw -g automatic-rename on
set -g  set-titles off
set -g  display-panes-time 2000
set -g  display-time 2500
set -g  status-interval 5
set -g  status-position top

# Mode keys.
set -g  status-keys vi
setw -g mode-keys vi
