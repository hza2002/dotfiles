# Native tmux visuals must follow Catppuccin initialization.
set -gF pane-border-style 'fg=#{@gruvbox_dark1}'
set -gF pane-active-border-style 'fg=#{@gruvbox_bright_yellow}'
set -g pane-border-indicators both
set -gF display-panes-colour '#{@gruvbox_dark3}'
set -gF display-panes-active-colour '#{@gruvbox_bright_yellow}'

setw -gF mode-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_yellow}'
setw -gF copy-mode-match-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_neutral_aqua}'
setw -gF copy-mode-current-match-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_yellow},bold'
setw -gF copy-mode-mark-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_red}'
set -gF clock-mode-colour '#{@gruvbox_bright_yellow}'
set -gF message-style 'fg=#{@gruvbox_light1},bg=#{@gruvbox_dark2}'
set -gF message-command-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_yellow}'
set -gF popup-style 'fg=#{@gruvbox_light1},bg=default'
set -gF popup-border-style 'fg=#{@gruvbox_light4},bg=default'
set -gF menu-border-style 'fg=#{@gruvbox_light4},bg=default'

# Keep navigation stable while active-pane context stays on the right.
set -g status-left-length 100
set -g status-right-length 100
set -gF status-right-style \
  'fg=#{@gruvbox_light1},bg=default'
# Session starts flush at column zero and joins the window rail with one cut.
set -g @catppuccin_status_session \
  '#[fg=#{@gruvbox_light0},bg=#{@gruvbox_faded_aqua},bold]  #S #[nobold,fg=#{@gruvbox_faded_aqua},bg=default]#[none]'
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right \
  '#("$TMUX_PLUGIN_MANAGER_PATH"tmux-continuum/scripts/continuum_save.sh)#[bg=default]#{s/ //:#{E:@catppuccin_status_application}}'
# Host identity matters only when this tmux session is reached over SSH.
set -ag status-right '#{?#{SSH_CONNECTION},#{E:@catppuccin_status_host},}'
set -ag status-right '#{E:@catppuccin_status_uptime}'
set -ag status-right \
  '#{?#{window_zoomed_flag},#[fg=#{@gruvbox_neutral_yellow}] #[fg=#{@gruvbox_light0}#,bg=#{@gruvbox_neutral_yellow}]󰽏 #[fg=#{@gruvbox_light0}#,bg=#{@status_right_bg}#,bold] ZOOM,}'
set -ag status-right \
  '#{?#{==:#{pane_mode},copy-mode},#[fg=#{@gruvbox_neutral_purple}] #[fg=#{@gruvbox_light0}#,bg=#{@gruvbox_neutral_purple}]#{?selection_active,󰅍,󰅌} #[fg=#{@gruvbox_light0}#,bg=#{@status_right_bg}#,bold] COPY,}'
set -ag status-right \
  '#{?#{==:#{client_key_table},prefix},#[fg=#{@gruvbox_neutral_red}] #[fg=#{@gruvbox_light0}#,bg=#{@gruvbox_neutral_red}] #[fg=#{@gruvbox_light0}#,bg=#{@status_right_bg}#,bold] PREFIX,}'
set -ag status-right \
  '#{?#{@config_reloaded},#[fg=#{@gruvbox_neutral_green}] #[fg=#{@gruvbox_light0}#,bg=#{@gruvbox_neutral_green}]󰑐 #[fg=#{@gruvbox_light0}#,bg=#{@status_right_bg}#,bold] RELOADED,}'
