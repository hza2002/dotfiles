# tmux executes this manifest in order. Keep every module directly sourced so
# TPM can discover plugin declarations without traversing nested source files.

# Core behavior and bindings.
source-file ~/.config/tmux/conf/options.conf
source-file ~/.config/tmux/conf/bindings.conf

# Catppuccin inputs must precede its synchronous TPM initialization.
source-file ~/.config/tmux/conf/theme.conf
source-file ~/.config/tmux/conf/plugins.conf

# Native visual overrides must follow plugins.
source-file ~/.config/tmux/conf/ui.conf
