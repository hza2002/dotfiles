# =============================================================================
#  General
# =============================================================================
set -g  mouse on
set -g  default-terminal "tmux-256color"
set -g  terminal-overrides "linux*:AX@"
setw -g xterm-keys on
# Let invisible panes reach Ghostty for background command notifications.
set -g  allow-passthrough all
set -s  extended-keys on
if-shell -F '#{>=:#{version},3.5}' \
  'set -s extended-keys-format csi-u'
set -g  terminal-features "xterm*:RGB:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,tmux*:clipboard"
set -ga terminal-features "xterm-ghostty*:strikethrough:usstyle:overline:hyperlinks"
set -s  escape-time 0
set -sg repeat-time 300
set -s  focus-events on
setw -g aggressive-resize on
# Relay OSC 52 through nested tmux sessions to the attached terminal client.
set -s  set-clipboard on
set -s  copy-command ''
set -g  history-limit 50000
# When the current session disappears, keep the client alive by switching
# to the most recently active remaining session.
set -g  detach-on-destroy off
set -g  visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

# =============================================================================
#  Prefix
# =============================================================================
set -g @ime "command -v macism >/dev/null 2>&1 && macism com.apple.keylayout.ABC >/dev/null 2>&1 || true"

# Keep Ghostty's Command-key translations (\x06) in sync with this prefix.
# Plugins inspect this option during initialization; the IME-aware entry
# binding is installed after TPM has loaded them.
set -g prefix C-f
unbind C-b

# =============================================================================
#  Utility
# =============================================================================
# Ghostty Cmd+, sends C-f r. Skip TPM because not every plugin reloads idempotently.
bind    r   set -g @skip_plugin_reload 1 \; \
  source-file ~/.config/tmux/tmux.conf \; \
  set -gu @skip_plugin_reload \; \
  run-shell -b 'token=$$; tmux set-option -g @config_reloaded "$token"; sleep 2.5; \
    if [ "$(tmux show-option -gqv @config_reloaded)" = "$token" ]; then \
      tmux set-option -gu @config_reloaded; \
    fi'
bind    :   command-prompt
bind    C-c customize-mode -Z

# =============================================================================
#  Sessions
# =============================================================================
bind C run-shell 'sesh connect #{q:pane_current_path}'
bind R command-prompt -I "#S" { rename-session "%%" }
bind s choose-tree -Zs
bind -N "last-session (via sesh)" Tab run-shell "sesh last"
bind -N "project/session picker (sesh)" O display-popup -E -w 80% -h 75% \
  -d "#{pane_current_path}" -T "Projects" \
  "~/.config/tmux/scripts/project-picker.sh"
bind -N "pane manager (tmux-fzf)" P run-shell -b \
  "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/pane.sh"
bind -N "window manager (tmux-fzf)" W run-shell -b \
  "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/window.sh"

set -g  @continuum-restore 'on'
set -g  @continuum-save-interval '15'

# =============================================================================
#  Display & Indexing
# =============================================================================
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
setw -g automatic-rename on
set -g  set-titles on
set -g  display-panes-time 2000
set -g  display-time 2000
set -g  status-interval 5
set -g  status-position top

# =============================================================================
#  Mode Keys
# =============================================================================
set -g  status-keys vi
setw -g mode-keys vi

# =============================================================================
#  Windows
# =============================================================================
# --- prefix bindings ---
# Session rename lives on R; remove tmux's duplicate default binding.
unbind '$'
bind c   new-window -c "#{session_path}"
bind ,   command-prompt -I "#W" { rename-window "%%" }
bind f   command-prompt { find-window "%%" }
bind .   command-prompt "move-window -t '%%'"
bind w   choose-tree -Zw
bind n   next-window
bind p   previous-window
bind <   swap-window -d -t -1
bind >   swap-window -d -t +1
bind `   last-window

# Select the requested index when it exists; otherwise use the last window.
# Checking actual indices also handles gaps created by move-window.
bind 1 if -F '#{W:#{?#{==:#{window_index},1},1,}}' 'select-window -t ":1"' 'select-window -t ":{end}"'
bind 2 if -F '#{W:#{?#{==:#{window_index},2},1,}}' 'select-window -t ":2"' 'select-window -t ":{end}"'
bind 3 if -F '#{W:#{?#{==:#{window_index},3},1,}}' 'select-window -t ":3"' 'select-window -t ":{end}"'
bind 4 if -F '#{W:#{?#{==:#{window_index},4},1,}}' 'select-window -t ":4"' 'select-window -t ":{end}"'
bind 5 if -F '#{W:#{?#{==:#{window_index},5},1,}}' 'select-window -t ":5"' 'select-window -t ":{end}"'
bind 6 if -F '#{W:#{?#{==:#{window_index},6},1,}}' 'select-window -t ":6"' 'select-window -t ":{end}"'
bind 7 if -F '#{W:#{?#{==:#{window_index},7},1,}}' 'select-window -t ":7"' 'select-window -t ":{end}"'
bind 8 if -F '#{W:#{?#{==:#{window_index},8},1,}}' 'select-window -t ":8"' 'select-window -t ":{end}"'
bind 9 if -F '#{W:#{?#{==:#{window_index},9},1,}}' 'select-window -t ":9"' 'select-window -t ":{end}"'

# =============================================================================
#  Panes
# =============================================================================
# --- split ---
bind k split-window -vb -c "#{pane_current_path}"
bind j split-window -v  -c "#{pane_current_path}"
bind h split-window -hb -c "#{pane_current_path}"
bind l split-window -h  -c "#{pane_current_path}"

# Select a pane with prefix+q, followed by its displayed number.

# --- move ---
bind S choose-tree 'move-pane -v -s "%%"'
bind V choose-tree 'move-pane -h -s "%%"'

bind x if -F '#{>:#{window_panes},1}' \
  { if -F '#{==:#{pane_current_command},#{b:default-shell}}' \
    { kill-pane } \
    { confirm-before -p 'close #{pane_current_command} in pane #P? (y/n)' kill-pane } } \
  { if -F '#{>:#{session_windows},1}' \
    { confirm-before -p 'kill-window #W? (y/n)' kill-window } \
    { confirm-before -p 'kill-session #S? (y/n)' kill-session } }
bind & if -F '#{>:#{session_windows},1}' \
  { confirm-before -p 'kill-window #W? (y/n)' kill-window } \
  { confirm-before -p 'kill-session #S? (y/n)' kill-session }

# =============================================================================
#  Copy Mode (vi)
# =============================================================================
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi y      send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter  send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-c run-shell "#{@ime}" \; send-keys -X cancel

bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi e send-keys -X next-word-end
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi J send-keys -N 5 -X cursor-down
bind -T copy-mode-vi K send-keys -N 5 -X cursor-up

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# =============================================================================
#  Vim Integration (seamless pane/window navigation)
# =============================================================================
set -g @is_vim_regex '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?)(-wrapped)?(diff)?$'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_regex}'"

# --- pane navigation (C-hjkl) ---
bind -n C-h if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind -n C-j if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -n C-k if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind -n C-l if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

bind -T copy-mode-vi C-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}'  '' 'select-pane -R'

# --- pane resize (C-arrows) ---
bind -n C-Left  if-shell "$is_vim" 'send-keys C-Left'  'resize-pane -L 1'
bind -n C-Down  if-shell "$is_vim" 'send-keys C-Down'  'resize-pane -D 1'
bind -n C-Up    if-shell "$is_vim" 'send-keys C-Up'    'resize-pane -U 1'
bind -n C-Right if-shell "$is_vim" 'send-keys C-Right' 'resize-pane -R 1'

bind -T copy-mode-vi C-Left  resize-pane -L 1
bind -T copy-mode-vi C-Down  resize-pane -D 1
bind -T copy-mode-vi C-Up    resize-pane -U 1
bind -T copy-mode-vi C-Right resize-pane -R 1

# =============================================================================
#  Input Method
# =============================================================================
# Pane focus can change through the mouse or prefixless navigation.
set-hook -g pane-focus-in 'run-shell "#{@ime}"'
# Let Ghostty sample the destination of panes whose applications hide the cursor.
set-hook -g 'after-select-pane[10]' \
  'run-shell -b "~/.config/tmux/scripts/reveal-hidden-cursor.sh #{q:client_tty} #{q:client_termname} #{q:pane_id} #{q:cursor_flag} #{q:pane_left} #{q:pane_top} #{q:pane_width} #{q:pane_height} #{q:status-position}"'

# Pinned upstream palettes. Application-specific semantics are mapped below.
source-file ~/.config/tmux/palettes/gruvbox.conf
source-file ~/.config/tmux/palettes/gruvbox-material-dark-medium.conf

# =============================================================================
#  Plugins (TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Agent overview. Open only on demand; one sidebar process per visible window.
set -g @sidebar_key A
set -g @sidebar_key_all off
set -g @sidebar_close_key M-A
set -g @sidebar_width 40
set -g @sidebar_position left
set -g @sidebar_bottom_height 0
set -g @sidebar_auto_create off
set -g @sidebar_notifications on
set -g @sidebar_pet off
set -g @agent-sidebar-default-agent codex
set -g @plugin 'hza2002/tmux-agent-sidebar'

# Global management palette; session switching stays with sesh.
set-environment -g TMUX_FZF_ORDER 'pane|window|command|keybinding|process'
set-environment -g TMUX_FZF_OPTIONS '-p -w 75% -h 60% -m'
set-environment -g TMUX_FZF_PANE_FORMAT '#{window_name} | #{pane_current_command} | #{b:pane_current_path} #{?pane_active,[active],}'
set-environment -g TMUX_FZF_WINDOW_FORMAT '#{window_name} | #{window_panes} panes | #{b:pane_current_path} #{?window_active,[active],}'
set -g @plugin 'sainnhe/tmux-fzf'

# resurrect/continuum loaded last so continuum's status-right save hook
# isn't clobbered by the gruvbox theme
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Ordinary config reloads skip plugin initialization; TPM manages its own
# install and update lifecycle separately.
if -F '#{==:#{@skip_plugin_reload},}' {
  if-shell '[ -r ~/.config/tmux/plugins/tpm/tpm ] && [ -x ~/.config/tmux/plugins/tpm/tpm ]' \
    'run ~/.config/tmux/plugins/tpm/tpm' \
    'display-message "TPM unavailable: ~/.config/tmux/plugins/tpm/tpm"'
}

# Keep the session distinct without competing with the active window accent.
set -g status-left '#[bg=#{@gruvbox_neutral_aqua},fg=#{@gruvbox_dark0},bold] #S #[bg=#{@gruvbox_dark1},fg=#{@gruvbox_neutral_aqua},nobold,noitalics,nounderscore]'

# Enter the prefix table explicitly so every prefix command starts in ASCII.
# Double C-f still sends a literal C-f to nested tmux sessions and applications.
set -g prefix None
bind -T root   C-f run-shell "#{@ime}" \; switch-client -T prefix
bind -T prefix C-f send-keys C-f
bind -T root   C-c run-shell "#{@ime}" \; send-keys C-c
bind -T root   C-z run-shell "#{@ime}" \; send-keys C-z

# Gruvbox UI polish. Keep these after the theme plugin so it cannot override
# the visual hierarchy.
set -gF pane-border-style 'fg=#{@gruvbox_dark1}'
set -gF pane-active-border-style 'fg=#{@gruvbox_bright_yellow}'
set -g pane-border-indicators both
set -gF display-panes-colour '#{@gruvbox_dark3}'
set -gF display-panes-active-colour '#{@gruvbox_bright_yellow}'

setw -gF mode-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_yellow}'
setw -gF copy-mode-match-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_neutral_aqua}'
setw -gF copy-mode-current-match-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_yellow},bold'
set -gF message-style 'fg=#{@gruvbox_light1},bg=#{@gruvbox_dark2}'
set -gF message-command-style 'fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_yellow}'

set -g status-left-length 30
set -g status-right-length 90
set -g status-right '#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'
set -ag status-right '#{?client_prefix,#[fg=#{@gruvbox_dark0}#,bg=#{@gruvbox_bright_orange}#,bold] PREFIX #[default],}'
set -ag status-right '#{?window_zoomed_flag,#[fg=#{@gruvbox_dark0}#,bg=#{@gruvbox_bright_yellow}#,bold] ZOOM #[default],}'
set -ag status-right '#{?pane_in_mode,#[fg=#{@gruvbox_dark0}#,bg=#{@gruvbox_bright_blue}#,bold] #{pane_mode} #[default],}'
set -ag status-right '#{?#{SSH_CONNECTION},#[fg=#{@gruvbox_light4}] #h #[default],}'
set -ag status-right '#{?@config_reloaded,#[fg=#{@gruvbox_dark0}#,bg=#{@gruvbox_bright_green}#,bold] TMUX RELOADED #[default],}'
