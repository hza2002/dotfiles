# =============================================================================
#  General
# =============================================================================
set -g  mouse on
set -g  default-terminal "tmux-256color"
set -g  terminal-overrides "linux*:AX@,*256col*:RGB,*:Tc"
setw -g xterm-keys on
set -g  allow-passthrough on
set -s  extended-keys on
set -s  extended-keys-format csi-u
set -g  terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,rxvt*:ignorefkeys"
set -ga terminal-features "ghostty*:RGB:hyperlinks:strikethrough:usstyle:overline"
set -s  escape-time 0
set -sg repeat-time 300
set -s  focus-events on
set -s  set-clipboard external
set -g  history-limit 10000
# When the current session disappears, keep the client alive by switching
# to the most recently active remaining session.
set -g  detach-on-destroy off
set -g  visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

# =============================================================================
#  Prefix
# =============================================================================
# Keep Ghostty's Command-key translations (\x06) in sync with this prefix.
set -g prefix C-f

# =============================================================================
#  Utility
# =============================================================================
bind    r   source-file ~/.tmux.conf \; \
  display-message -N -d 2500 \
  '#[fg=#282828,bg=#b8bb26,bold] TMUX CONFIG RELOADED #[default]'
bind    :   run-shell "#{@ime}" \; command-prompt
bind    C-c run-shell "#{@ime}" \; customize-mode -Z

# =============================================================================
#  Sessions
# =============================================================================
bind C new-session -c "#{pane_current_path}"
bind R run-shell "#{@ime}" \; command-prompt -I "#S" { rename-session "%%" }
bind s run-shell "#{@ime}" \; choose-tree -Zs
bind Tab switch-client -l

set -g  @continuum-restore 'on'
set -g  @continuum-save-interval '15'
set -g  @resurrect-capture-pane-contents 'on'

# =============================================================================
#  Display & Indexing
# =============================================================================
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
setw -g automatic-rename on
set -g  set-titles on
set -g  display-panes-time 2000
set -g  display-time 2000
set -g  status-interval 5
set -g  status-position top

# =============================================================================
#  Mode Keys
# =============================================================================
set -g  status-keys vi
setw -g mode-keys vi

# =============================================================================
#  Windows
# =============================================================================
# --- prefix bindings ---
# Session rename lives on R; remove tmux's duplicate default binding.
unbind '$'
bind c   new-window -c "#{pane_current_path}"
bind ,   run-shell "#{@ime}" \; command-prompt -I "#W" { rename-window "%%" }
bind f   run-shell "#{@ime}" \; command-prompt { find-window "%%" }
bind .   run-shell "#{@ime}" \; command-prompt "move-window -t '%%'"
bind w   run-shell "#{@ime}" \; choose-tree -Zw
bind n   next-window
bind p   previous-window
bind <   swap-window -d -t -1
bind >   swap-window -d -t +1
bind `   last-window

# Select the requested index when it exists; otherwise use the last window.
# Checking actual indices also handles gaps created by move-window.
bind 1 if -F '#{W:#{?#{==:#{window_index},1},1,}}' 'select-window -t ":1"' 'select-window -t ":{end}"'
bind 2 if -F '#{W:#{?#{==:#{window_index},2},1,}}' 'select-window -t ":2"' 'select-window -t ":{end}"'
bind 3 if -F '#{W:#{?#{==:#{window_index},3},1,}}' 'select-window -t ":3"' 'select-window -t ":{end}"'
bind 4 if -F '#{W:#{?#{==:#{window_index},4},1,}}' 'select-window -t ":4"' 'select-window -t ":{end}"'
bind 5 if -F '#{W:#{?#{==:#{window_index},5},1,}}' 'select-window -t ":5"' 'select-window -t ":{end}"'
bind 6 if -F '#{W:#{?#{==:#{window_index},6},1,}}' 'select-window -t ":6"' 'select-window -t ":{end}"'
bind 7 if -F '#{W:#{?#{==:#{window_index},7},1,}}' 'select-window -t ":7"' 'select-window -t ":{end}"'
bind 8 if -F '#{W:#{?#{==:#{window_index},8},1,}}' 'select-window -t ":8"' 'select-window -t ":{end}"'
bind 9 if -F '#{W:#{?#{==:#{window_index},9},1,}}' 'select-window -t ":9"' 'select-window -t ":{end}"'

# =============================================================================
#  Panes
# =============================================================================
# --- split ---
bind k split-window -vb -c "#{pane_current_path}"
bind j split-window -v  -c "#{pane_current_path}"
bind h split-window -hb -c "#{pane_current_path}"
bind l split-window -h  -c "#{pane_current_path}"

# Select a pane with prefix+q, followed by its displayed number.

# --- move ---
bind S run-shell "#{@ime}" \; choose-tree 'move-pane -v -s "%%"'
bind V run-shell "#{@ime}" \; choose-tree 'move-pane -h -s "%%"'

bind x if -F '#{>:#{window_panes},1}' \
  kill-pane \
  { if -F '#{>:#{session_windows},1}' \
    { confirm-before -p 'kill-window #W? (y/n)' kill-window } \
    { confirm-before -p 'kill-session #S? (y/n)' kill-session } }
bind & if -F '#{>:#{session_windows},1}' \
  { confirm-before -p 'kill-window #W? (y/n)' kill-window } \
  { confirm-before -p 'kill-session #S? (y/n)' kill-session }

# =============================================================================
#  Copy Mode (vi)
# =============================================================================
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; else cat >/dev/null; fi'
bind -T copy-mode-vi Escape send-keys -X cancel

bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi e send-keys -X next-word-end
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi J send-keys -N 5 -X cursor-down
bind -T copy-mode-vi K send-keys -N 5 -X cursor-up

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# =============================================================================
#  Toggles
# =============================================================================
# bind C-g if-shell '[[ $(tmux showw synchronize-panes | cut -d\  -f2) == "on" ]]' \
#   'setw synchronize-panes off; set -g pane-border-style fg=magenta' \
#   'setw synchronize-panes on;  set -g pane-border-style fg=red'

# =============================================================================
#  Vim Integration (seamless pane/window navigation)
# =============================================================================
set -g @is_vim_regex '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?)(-wrapped)?(diff)?$'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_regex}'"

# --- pane navigation (C-hjkl) ---
bind -n C-h if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind -n C-j if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -n C-k if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind -n C-l if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

bind -T copy-mode-vi C-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}'  '' 'select-pane -R'

# --- pane resize (C-arrows) ---
bind -n C-Left  if-shell "$is_vim" 'send-keys C-Left'  'resize-pane -L 1'
bind -n C-Down  if-shell "$is_vim" 'send-keys C-Down'  'resize-pane -D 1'
bind -n C-Up    if-shell "$is_vim" 'send-keys C-Up'    'resize-pane -U 1'
bind -n C-Right if-shell "$is_vim" 'send-keys C-Right' 'resize-pane -R 1'

bind -T copy-mode-vi C-Left  resize-pane -L 1
bind -T copy-mode-vi C-Down  resize-pane -D 1
bind -T copy-mode-vi C-Up    resize-pane -U 1
bind -T copy-mode-vi C-Right resize-pane -R 1

# =============================================================================
#  Input Method
# =============================================================================
set -g @ime "macism com.apple.keylayout.ABC 2>/dev/null"

set-hook -g pane-focus-in 'run-shell "#{@ime}"'

# =============================================================================
#  Plugins (TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
# resurrect/continuum loaded last so continuum's status-right save hook
# isn't clobbered by the gruvbox theme
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

if-shell '[ -r ~/.tmux/plugins/tpm/tpm ] && [ -x ~/.tmux/plugins/tpm/tpm ]' \
  'run ~/.tmux/plugins/tpm/tpm' \
  'display-message "TPM unavailable: ~/.tmux/plugins/tpm/tpm"'

# Gruvbox UI polish. Keep these after the theme plugin so it cannot override
# the visual hierarchy.
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#fabd2f'
set -g pane-border-indicators both
set -g display-panes-colour '#665c54'
set -g display-panes-active-colour '#fabd2f'

setw -g mode-style 'fg=#282828,bg=#fabd2f'
set -g message-style 'fg=#ebdbb2,bg=#504945'
set -g message-command-style 'fg=#282828,bg=#fabd2f'

set -g status-left-length 30
set -g status-right-length 60
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'
set -ag status-right '#{?client_prefix,#[fg=#282828#,bg=#fe8019#,bold] PREFIX #[default],}'
set -ag status-right '#{?window_zoomed_flag,#[fg=#282828#,bg=#fabd2f#,bold] ZOOM #[default],}'
set -ag status-right '#{?pane_in_mode,#[fg=#282828#,bg=#83a598#,bold] #{pane_mode} #[default],}'
set -ag status-right '#{?#{SSH_CONNECTION},#[fg=#a89984] #h #[default],}'
